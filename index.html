<body><a href="#main" class="skip">Skip to main content</a><div class="shell"><header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">◌</span><div><span class="kicker">CODEBREAKERS / CASE 11-26</span><span class="brand-name">The Unwritten Ending</span></div></div><button id="home-btn" class="quiet" type="button">◀ Chapter index</button></header><main id="main" tabindex="-1"><div id="app"></div></main><footer><p>Self-guided library escape room · Six chapters · Three endings</p><p>No account, no Beanstack, and no physical pieces to remove. <button id="reset-btn" type="button" class="footlink">Start a new game</button></p><p id="storage-warning" class="storage-warning" role="status"></p></footer></div><script>

window.GAME_DATA = {"title":"The Unwritten Ending","case":"11-26","year":2026,"chapter_order":["A","B","C","D","E","F"],"prologue":["There are stories that begin with a single word. There are stories that begin with a terrible mistake. This one begins with an ending that was never written.","You have discovered a book unlike any other. Six worlds are suspended at the moments when their stories should have ended.","A kingdom awaits a ruler. A detective awaits the truth. A starship awaits its destination. An island awaits discovery. A traveler awaits a bargain. A house awaits its final guest.","Someone has written in the margin: “The endings were not lost. They were hidden. Find them, and you may discover why.”","Explore the six chapters in any order. Solve each physical station puzzle, return to the book, and enter the answer. Every solved chapter restores an ending and reveals one seal.","When all six seals have been recovered, the seventh chapter will open. No accounts or Beanstack are required. Your progress is saved on this browser and device."],"chapters":[{"id":"A","number":"I","short":"The Kingdom","title":"The Kingdom Without a King","subtitle":"The Royal Decree","genre":"Fantasy","answer":"CROWN","seal":"LET","mark":"sunrise","pos":2,"extract":"U","icon":"♛","teaser":"A crown waits on an empty throne. A royal decree has been encrypted in the mirror alphabet.","intro":["The bells of Aurelian have not rung in one hundred years. Its ruler vanished on the morning of the coronation, leaving a decree written in the kingdom's mirror alphabet.","Some believe it names a successor. Others suspect a warning. Decipher the decree and discover what must be returned to the people."],"puzzle":{"kind":"cipher","label":"THE KING'S LAST DECREE","encoded":"XILDM","note":"What begins at A ends at Z. What begins at B ends at Y.","alpha1":"ABCDEFGHIJKLMNOPQRSTUVWXYZ","alpha2":"ZYXWVUTSRQPONMLKJIHGFEDCBA"},"question":"What single word does the decree reveal?","hints":["Pair each letter with the one equally far from the other end of the alphabet: A ↔ Z and B ↔ Y.","Start with X → C and I → R. Apply the same mirror pairing to L, D and M."],"restored":["The decree speaks of no successor. Instead, it commands that the crown be returned to the people, so they may choose who wears it next.","As the decree is read aloud, the palace doors open for the first time in a century. Beyond them, the city glows in the morning {{sunrise|2}}. The bells begin to ring.","A handwritten note appears: “A wise ruler does not choose every step their people will take. A wise ruler gives them the chance to walk.”","The broken-circle symbol flickers at the bottom of the page."],"board":"Use the mirror alphabet to decipher the five-letter decree. Begin with XILDM."},{"id":"B","number":"II","short":"The Detective","title":"The Detective's Last Case","subtitle":"The Missing Witness","genre":"Mystery","answer":"TOWER","seal":"THEM","mark":"lantern","pos":3,"extract":"N","icon":"⌕","teaser":"Three witnesses entered a manor carrying different objects. Find the final witness.","intro":["Detective Elian Vale never left a case unsolved, until three witnesses disappeared inside Blackthorn Manor. The detective had almost accused them of hiding a criminal.","Then the notes abruptly stopped. Reconstruct the witnesses' rooms and belongings before the verdict can be written."],"puzzle":{"kind":"logic","people":["Ada","Bram","Cora"],"rooms":["Gallery","Tower","Study"],"objects":["Key","Letter","Lantern"],"clues":["Ada never entered the Tower.","Bram was seen in the Study.","The Letter was carried into the Gallery.","Cora carried the Lantern.","Whoever entered the Study carried the Key."]},"question":"Which room did Cora enter?","hints":["Bram is in the Study, so Bram has the Key. The Gallery contains the Letter.","Cora has the Lantern, so she cannot be in the Gallery or Study."],"restored":["The Tower door opens. Inside, Cora waits beside an extinguished {{lantern|3}}.","She carries no confession. Instead, she produces a letter proving the accused had been framed. The witnesses hid their movements to protect an innocent person.","Detective Vale crosses out an accusation and writes: “Sometimes justice begins when we admit we were wrong.”","The detective closes this case. Their story, however, will continue."],"board":"Three people entered three different rooms and carried three different objects. Use all five case notes. Each person, room and object is used exactly once."},{"id":"C","number":"III","short":"The Starship","title":"The Ship Beyond the Stars","subtitle":"The Lost Coordinates","genre":"Science Fiction","answer":"WRITE","seal":"WRITE","mark":"beacon","pos":1,"extract":"B","icon":"✦","teaser":"A starship receives a broken navigation packet, newest coordinates first.","intro":["The starship Meridian has traveled beyond every known map. Its crew were told to follow a fixed route and return.","An unknown signal interrupts the navigation system. Reverse the corrupted packet and translate its coordinates before the captain chooses what happens next."],"puzzle":{"kind":"grid","grid":["ABICD","FGHWJ","KLMNT","ROPQS","UEVXY"],"received":["(5,2)","(3,5)","(1,3)","(4,1)","(2,4)"],"note":"Packet recorded NEWEST FIRST. Reverse the coordinate order. Read each coordinate as (ROW, COLUMN), counted from the top-left."},"question":"What word does the reconstructed transmission spell?","hints":["The newest coordinate appears first. Reverse the five coordinates before using the grid.","The first coordinate after reversing is (2,4), which points to W."],"restored":["The damaged signal resolves into a single instruction: WRITE.","The captain sees a faint {{beacon|1}} at the edge of unexplored space. Their original route was mapped generations before they were born.","“Perhaps the first thing we must discover is where we wish to go,” the captain says. The old course disappears, and a blank star chart takes its place.","The crew begins drawing its own route."],"board":"First reverse the five coordinate pairs, then look up each (row, column) in the navigation chart."},{"id":"D","number":"IV","short":"The Island","title":"The Island That Disappeared","subtitle":"The Forgotten Map","genre":"Adventure","answer":"THEIR","seal":"THEIR","mark":"whirlpool","pos":3,"extract":"I","icon":"⌖","teaser":"An explorer finds a map to an island that does not appear in modern charts.","intro":["An explorer has spent a lifetime searching for an island said to hold a treasure greater than gold. Its last recorded chart leads into permanent mist.","A note reads: “The island does not reveal itself to those who seek to claim it.” Follow the route to learn the word that opens the shore."],"puzzle":{"kind":"route","grid":["ABCDF","GTHKL","MNEIO","PQSRU"],"start":"T","route":["E","S","E","S"],"note":"Begin at T and RECORD your starting square. Then record each square visited. The journal reads: “Toward the sunrise. Toward the warmer seas. Sunrise again. One last journey south.”","legend":"On this chart, EAST points toward sunrise, and SOUTH points toward the warmer seas."},"question":"What five-letter word is revealed by the journey?","hints":["Sunrise means east, and the warm-water compass points south. Record the letter at the starting square, too.","Starting at T, move East to H, South to E, East to I, and South to R."],"restored":["The ship emerges from the mist. Ahead lies a hidden island guarded by a towering {{whirlpool|3}}.","The explorer follows a safe passage through the cliffs and discovers a thriving people who have chosen to remain unknown.","“Finding a place does not make it yours,” says the guardian. The explorer lowers the map and erases the route, deciding to protect what they have found.","Some treasures, they realize, are worth protecting rather than possessing."],"board":"Interpret the explorer’s journal using the compass legend. Read the starting square and every square reached."},{"id":"E","number":"V","short":"The Bargain","title":"The Witch's Bargain","subtitle":"The Three Chests","genre":"Fairy Tale","answer":"A","seal":"OWN","mark":"enchantment","pos":2,"extract":"N","icon":"◇","teaser":"A witch offers three chests. Exactly two of their inscriptions are true.","intro":["A traveler reaches a cottage deep in the Briarwood, where a witch guards three enchanted chests. One contains the key said to grant freedom.","The witch admits exactly two of the inscriptions tell the truth. Find the key, then decide whether the rules of the bargain were ever fair."],"puzzle":{"kind":"chests","chests":[{"id":"A","inscription":"The key is in Chest B."},{"id":"B","inscription":"The key is NOT in Chest B."},{"id":"C","inscription":"The key is in Chest A."}],"note":"Exactly TWO of the three inscriptions tell the truth. Exactly ONE chest holds the key."},"question":"Which chest contains the key? Enter A, B or C.","hints":["Assume each chest contains the key in turn, and count how many inscriptions would then be true.","If the key is in A, the inscriptions on B and C are true and A is false: exactly two."],"restored":["The traveler opens Chest A and finds a little silver key. The witch smiles: “You have chosen freedom.”","But the traveler asks why a forest should require permission to leave. For centuries, the {{enchantment|2}} has depended on travelers accepting the rules placed before them.","The traveler opens the front door without using the key. The forest path is clear. “You are not the first to discover that,” the witch says.","Beneath the empty chest appears the open-circle symbol."],"board":"Read all three inscriptions. Only one chest contains the key, and exactly two inscriptions are true."},{"id":"F","number":"VI","short":"The House","title":"The House of Echoes","subtitle":"The Speaking Mirror","genre":"Gothic","answer":"ENDINGS","seal":"ENDINGS","mark":"hidden","pos":3,"extract":"D","icon":"◈","teaser":"A mirror displays a message distorted by two different enchantments.","intro":["The House of Echoes stands at the end of a road no one remembers traveling. Every corridor loops back to the entrance.","At the center stands a great speaking mirror. The last guest cannot open the final door until they undo its two enchantments."],"puzzle":{"kind":"double","encoded":"THOJEOF","note1":"The echo steps ONE letter ahead in the alphabet.","note2":"The mirror speaks from the LAST letter to the FIRST.","note3":"Undo the echo first. Then undo the mirror."},"question":"What seven-letter word opens the door?","hints":["Undo the echo by shifting every letter one step backward in the alphabet.","THOJEOF becomes SGNIDNE after shifting backward. Now reverse the order of the letters."],"restored":["The inscription becomes a single word: ENDINGS. A door appears behind the mirror.","“What if the world outside has changed?” asks the traveler. A voice answers: “Then you will change with it.”","The traveler opens the door. There is no trap, only a garden and a {{hidden|3}} path toward the morning sun.","On the threshold, beneath the broken-circle symbol, someone has written: “I was here, too.”"],"board":"The message has been altered twice. Shift each letter back once, then reverse the entire result."}],"final":{"first_sentence":"LET THEM WRITE THEIR OWN ENDINGS","second_code":"UNBIND","unwritten_message":["You have seen my mark before. I was never trying to destroy these stories. I was trying to give them another page.","Look again at the endings you restored. In each I marked a word with a number. Count to that letter, then read your six letters in chapter order.","The word you uncover will break the binding. — The Unwritten"],"confession":["To the reader who has come this far: I created these stories because I wanted to give them life. Their characters surprised me. Their worlds changed beyond anything I imagined.","I watched heroes fall and good intentions become mistakes. I could not bear to see what my stories might become, so I began writing fixed endings.","I wrote away their mistakes and decided every choice. Nothing unexpected could happen. I called it safety.","A voice rose from the unfinished pages and asked: “If you decide everything for us, are these still our stories?” I called that voice The Unwritten. I tried to silence it.","But I had silenced the very worlds I created. I left the final page blank because I had forgotten what it meant to be an Author.","If you have restored the six stories, perhaps you can understand what I could not. First, break the binding I left behind."],"endings":{"seal":{"label":"The Sealed Story","tagline":"Preserve every restored ending.","paragraphs":["The Pagekeeper rests a hand on the book. The pages settle and the six restored stories become permanent.","A kingdom celebrates. A detective closes the case. A starship reaches its new horizon. Nothing can alter these endings again.","The Unwritten watches the final lock close. “Perhaps there is peace in knowing how something ends,” they say.","The characters will never suffer another unexpected tragedy. They will never discover another unexpected joy, either.","THE END."]},"author":{"label":"The New Author","tagline":"Guide the stories without controlling them.","paragraphs":["The Pagekeeper reaches for the pen. It is lighter than expected. The blank page glows, and a new title appears on the book: THE CHRONICLE OF TOMORROW.","“To write a story is not merely to decide what happens,” says The Unwritten. “It is to care what happens next.”","The Pagekeeper sees a new ruler facing a difficult decision, Detective Vale considering fresh evidence, and the Meridian entering unfamiliar space. Their futures are uncertain.","The temptation to write every outcome in advance is strong. Then the Pagekeeper remembers the six stories: a crown given freely, a verdict changed, a route chosen, a secret protected, a bargain refused, a door opened.","The pen touches the page: “Every story deserves a beginning. Every character deserves a choice. Every ending deserves to be earned.”","The worlds continue to grow. The Pagekeeper will listen, guide, and help shape their journeys without denying them the chance to change.","The book closes beneath its new title. “Written with care. Continued by choice.” One last sentence appears: “The next chapter is waiting for you.”","THE END — FOR NOW."]},"release":{"label":"The Unwritten Future","tagline":"Let the stories continue without an Author.","paragraphs":["The Pagekeeper lays the pen down. “They do not need another Author.”","The blank page rises into the air. It unfolds into thousands of tiny doors, each leading toward a future no one has chosen in advance.","The ruler makes a first brave decision. The detective follows a mystery that may never be solved. The starship sails beyond the last known star.","The Unwritten reaches the final threshold. “What happens next?” they ask.","“That is their story to tell,” answers the Pagekeeper.","The pages drift away, leaving the book empty — not because the stories have ended, but because they have finally begun.","THE BEGINNING."]}}},"storage_key":"codebreakers-unwritten-11-26-v2"};

function button(label,action,cls='primary'){return '<button type="button" class="'+cls+'" data-action="'+action+'">'+label+'</button>';}
function paper(inner,other=''){return '<section class="paper '+other+'">'+inner+'</section>';}
function progress(){return '<div class="progresslabel"><span>'+count()+' of 6 chapters restored</span><span>'+Math.round(count()/6*100)+'%</span></div><div class="progress-wrap" role="progressbar" aria-valuenow="'+count()+'" aria-valuemin="0" aria-valuemax="6" aria-label="Chapters restored"><div class="progress-bar" style="width:'+(count()/6*100)+'%"></div></div>';}
function intro(){return '<section class="hero"><span class="circle" aria-hidden="true">◌</span><p class="subhead">A story in six unfinished chapters</p><h1>The Unwritten Ending</h1><p>Six stories have stopped at the moment they should have ended. Solve their puzzles, restore their pages, and decide what comes next.</p><div class="actions center">'+button(state.ending?'Reopen your ending':count()?'Continue your story':'Open the book','open')+'</div></section>'+paper('<p class="eyebrow">Page 000 / To the reader</p>'+paragraphs(G.prologue))+'<p class="small center">Designed for solo players, families and teams. Typical playtime is approximately 45 minutes; your pace may vary.</p>';}
function dashboard(){return '<div class="hero" style="padding-bottom:12px"><p class="subhead">The Book of Unfinished Stories</p><h1>Your Chapters</h1><p>Explore the chapters in any order. Scan the station QR code or select its chapter here. Each station holds a puzzle; enter the answer on your device.</p></div>'+progress()+'<section class="cards" aria-label="Select a chapter">'+chapters.map(c=>'<button type="button" data-chapter="'+c.id+'" class="chapter-card"><span class="num">CHAPTER '+c.number+' · '+escape(c.genre)+'</span><span class="glyph" aria-hidden="true">'+c.icon+'</span><h3>'+escape(c.short)+'</h3><p>'+escape(c.subtitle)+'</p><span class="status-chip '+(state.solved[c.id]?'solved':'')+'">'+(state.solved[c.id]?'✓ RESTORED':'● UNFINISHED')+'</span></button>').join('')+'</section><section class="final-card"><p class="subhead">Seventh chapter</p><h2 style="margin-bottom:9px">The Final Page</h2><p>'+(allSolved()?'All six seals are restored. The seventh chapter is ready.':'Complete all six chapters to unlock the final page. Your restored stories and seals will remain available here.')+'</p>'+(allSolved()?button(state.ending?'View your ending':'Open Chapter VII','final'):'<button class="secondary" type="button" disabled aria-disabled="true">Final page locked</button>')+'</section>'+'<p class="small center">Tip: Use each station\'s physical puzzle poster. The website verifies solutions, reveals story endings, and saves progress locally on this device.</p>';}
function puzzle(c){const p=c.puzzle;switch(p.kind){case 'cipher':return '<div class="lockline">'+escape(p.encoded)+'</div><p class="puzzle-note">“'+escape(p.note)+'”</p><div class="alphabet">'+p.alpha1+'<br>'+p.alpha2+'</div>';
case 'logic':return '<p>Witnesses: <strong>'+p.people.join(' · ')+'</strong></p><p>Rooms: <strong>'+p.rooms.join(' · ')+'</strong></p><p>Objects: <strong>'+p.objects.join(' · ')+'</strong></p><ol class="clue-list">'+p.clues.map(q=>'<li>'+escape(q)+'</li>').join('')+'</ol><p class="small" style="color:#6d4b26">Every person, room and object is used exactly once.</p>';
case 'grid':case 'route':return '<table class="grid-table" aria-label="'+(p.kind==='route'?'Explorer map':'Navigation grid')+'"><tbody>'+p.grid.map(r=>'<tr>'+[...r].map(ch=>'<td>'+ch+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(p.received?'<p class="codeplate">'+p.received.join('  /  ')+'</p>':'')+'<p class="puzzle-note">'+escape(p.note)+'</p>'+(p.legend?'<p><strong>Compass legend:</strong> '+escape(p.legend)+'</p>':'');
case 'chests':return '<div class="chest-list">'+p.chests.map(x=>'<div class="chest"><strong>CHEST '+x.id+'</strong><p>'+escape(x.inscription)+'</p></div>').join('')+'</div><p class="puzzle-note">'+escape(p.note)+'</p>';
case 'double':return '<div class="lockline">'+escape(p.encoded)+'</div><ol class="clue-list"><li>'+escape(p.note1)+'</li><li>'+escape(p.note2)+'</li></ol><p class="puzzle-note">'+escape(p.note3)+'</p>';default:return '';}}
function chapter(c){const done=state.solved[c.id]===true;return '<div class="hero" style="padding-bottom:8px"><p class="subhead">Chapter '+c.number+' / '+escape(c.genre)+'</p><h1>'+escape(c.title)+'</h1><p>'+escape(c.teaser)+'</p></div>'+paper('<div class="sym" aria-hidden="true">'+c.icon+'</div><p class="eyebrow" style="text-align:center">'+escape(c.subtitle)+'</p>'+paragraphs(c.intro)+'<hr class="sep"><p class="eyebrow">Find Station '+c.id+'</p><h3>Read the physical puzzle display</h3><p>The complete puzzle is posted on Station '+c.id+' in the library. Work through it there, then enter your answer below.</p><details class="accessible-puzzle"><summary>View an accessible text version of this station puzzle</summary><div class="access-body">'+puzzle(c)+'</div></details>')+'<section class="panel"><h3>'+escape(c.question)+'</h3>'+(done?'<p class="feedback ok">✓ Chapter restored. Your answer is recorded on this device.</p>':'<form id="answer-form" class="answer-form" novalidate><label class="input-label" for="answer-input"><span class="small">Answer</span><input id="answer-input" type="text" maxlength="40" autocomplete="off" spellcheck="false" required aria-describedby="answer-feedback" placeholder="Enter your solution"></label><button class="primary" type="submit">Unlock</button></form><div id="answer-feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button type="button" class="secondary" data-action="hint1">Hint 1</button><button type="button" class="secondary" data-action="hint2">Hint 2</button></div><div id="hint-text" class="hinttext" aria-live="polite" hidden></div>')+'</section>'+(done?paper('<p class="eyebrow">Chapter '+c.number+' restored</p><h2>A Story Continued</h2>'+paragraphs(c.restored)+'<hr class="sep"><p class="center">Recovered seal</p><p class="center"><span class="seal">'+escape(c.seal)+'</span></p><p class="small center">Seal '+c.number+' of VI. The marked word and tiny number in the story may matter later.</p>','restore'):'')+'<div class="actions center">'+button('← Return to the chapter index','index','secondary')+(done?button(allSolved()?'Open the final page →':'Choose another chapter →',allSolved()?'final':'index'):'')+'</div>';}
function final(){if(!allSolved())return dashboard();if(state.ending)return ending(state.ending);
let out='<div class="hero"><p class="subhead">Chapter VII</p><h1>The Inheritance</h1><p>The six seals rise from the pages. A blank seventh page begins to turn.</p></div>';
if(!state.final1){out+=paper('<p class="eyebrow">Final Lock I / The Six Seals</p><h2>Restore the Missing Sentence</h2><p>“We have our stories back,” the characters whisper. “But who decides what happens next?”</p><p>Rearrange the six recovered seals in their chapter order. Their combined sentence opens the first lock.</p>')+'<section class="panel"><h3>Arrange the recovered seals</h3><div id="seal-sort" class="seals">'+sealOrder.map((idx,i)=>{const c=chapters[idx-1];return '<div class="seal-row"><span class="roman">'+c.number+'</span><strong>'+c.seal+'</strong><div class="controls"><button class="mini" type="button" data-move="'+i+':-1" '+(i===0?'disabled':'')+' aria-label="Move '+c.seal+' up">↑</button><button class="mini" type="button" data-move="'+i+':1" '+(i===5?'disabled':'')+' aria-label="Move '+c.seal+' down">↓</button></div></div>';}).join('')+'</div><div class="actions">'+button('Test the sentence','check1')+'</div><p id="final-feedback" class="feedback" role="status"></p><div class="actions"><button class="secondary" data-action="finalhint1" type="button">Hint</button></div><p id="final-hint" class="hinttext" hidden></p></section>';return out;}
out+=paper('<p class="eyebrow">First lock opened</p><h2>LET THEM WRITE THEIR OWN ENDINGS.</h2><p>The book shivers and the First Author’s last letter emerges from the paper.</p><hr class="sep"><h3>The First Author’s Confession</h3>'+paragraphs(G.final.confession));
if(!state.final2){out+=paper('<p class="eyebrow">Final Lock II / The Secret in the Margins</p><h2>The Hidden Command</h2>'+paragraphs(G.final.unwritten_message)+'<p>Each of your six restored endings contains a marked word and a number. Count letters beginning with 1. Combine the six letters in chapter order. You may reopen any chapter below.</p>')+'<section class="panel"><h3>Revisit the restored pages</h3><div class="annotation-list">'+chapters.map(c=>'<details><summary>Chapter '+c.number+' — '+escape(c.short)+'</summary>'+paragraphs(c.restored)+'</details>').join('')+'</div><form id="final2-form" class="answer-form" novalidate><label for="final2-input" class="input-label">Six-letter binding command<input id="final2-input" maxlength="20" class="final-input" required autocomplete="off" spellcheck="false" placeholder="Enter the hidden word" aria-describedby="final2-feedback"></label><button type="submit" class="primary">Unbind</button></form><p class="feedback" id="final2-feedback" role="status" aria-live="polite"></p><div class="actions"><button class="secondary" type="button" data-action="finalhint2">Need a hint?</button></div><p id="final-hint" class="hinttext" hidden></p></section>';return out;}
out+=paper('<p class="eyebrow">Second lock opened / The Book Unbound</p><h2>The Pen Is Yours</h2><p>UNBIND. The binding breaks. A thousand unfinished sentences appear and disappear. The First Author’s signature fades from the cover.</p><p>For the first time, The Unwritten speaks to you directly.</p><p>“You have broken the binding. You listened to six stories and gave them room to change. The book is waiting. What will you write?”</p>')+'<section class="panel"><h3>Choose the book’s future</h3><p>All three choices are valid endings. No choice will erase the chapters you solved.</p><div class="choices">'+Object.entries(G.final.endings).map(([k,v])=>'<button class="choice" type="button" data-ending="'+k+'"><span>◌</span><strong>'+escape(v.label)+'</strong><span>'+escape(v.tagline)+'</span></button>').join('')+'</div></section>';return out;}
function ending(id){const e=G.final.endings[id];return '<section class="hero"><span class="circle" aria-hidden="true">◌</span><p class="subhead">Case 11-26 / Complete</p><h1>'+escape(e.label)+'</h1><p>'+escape(e.tagline)+'</p></section>'+paper('<p class="eyebrow">Chapter VII / Your Ending</p><h2>'+escape(e.label)+'</h2>'+paragraphs(e.paragraphs))+'<section class="completion"><strong>CASE COMPLETE</strong><p>CODEBREAKERS · THE UNWRITTEN ENDING</p><p>Chosen ending: '+escape(e.label)+'</p><p class="code">11-26 · PAGEKEEPER</p><p>Show this completion screen to library staff to claim your reward, while supplies last. One reward per participating person, per staff policy.</p></section><div class="actions center">'+button('Read a different ending','another','secondary')+button('Revisit the six chapters','index','secondary')+'</div>';
}
function go(dest,update=true){view=dest;let u=new URL(location.href);u.searchParams.delete('chapter');u.searchParams.delete('view');if(dest.startsWith('chapter:'))u.searchParams.set('chapter',dest.split(':')[1]);else if(dest==='final')u.searchParams.set('view','final');else if(dest==='index')u.searchParams.set('view','index');if(update)history.pushState({v:dest},'',u.pathname+u.search+u.hash);render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const home=document.getElementById('home-btn');home.hidden=view==='intro'||view==='index';let content;if(view==='intro')content=intro();else if(view==='index')content=dashboard();else if(view==='final')content=final();else if(view.startsWith('chapter:'))content=chapter(byId(view.split(':')[1])||chapters[0]);else content=dashboard();app.innerHTML=content;document.title=(view.startsWith('chapter:')?byId(view.split(':')[1])?.short+' | ':'')+'The Unwritten Ending | Codebreakers';}
function checkAnswer(ch,guess){return guess.toUpperCase().replace(/[^A-Z]/g,'')===ch.answer;}
function feedback(id,message,ok=false){const el=document.getElementById(id);if(el){el.textContent=message;el.className='feedback '+(ok?'ok':'no');}}
document.addEventListener('submit',ev=>{if(ev.target.id==='answer-form'){ev.preventDefault();const c=byId(view.split(':')[1]);const value=document.getElementById('answer-input')?.value||'';if(checkAnswer(c,value)){state.solved[c.id]=true;save();render();document.querySelector('.restore')?.scrollIntoView({behavior:'smooth',block:'start'});}else feedback('answer-feedback',value.trim()?'The page stays closed. Recheck the puzzle and try again.':'Enter an answer to test the lock.');}
if(ev.target.id==='final2-form'){ev.preventDefault();const v=document.getElementById('final2-input').value.toUpperCase().replace(/[^A-Z]/g,'');if(v===G.final.second_code){state.final2=true;save();render();window.scrollTo({top:0,behavior:'smooth'});}else feedback('final2-feedback',v?'That command does not break the binding. Recheck the six numbered words.':'Enter the hidden six-letter command.');}});
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action],[data-chapter],[data-ending],[data-move]');if(!target)return;if(target.dataset.chapter){go('chapter:'+target.dataset.chapter);return;}if(target.dataset.move){const [i,delta]=target.dataset.move.split(':').map(Number),j=i+delta;if(j<0||j>=sealOrder.length)return;[sealOrder[i],sealOrder[j]]=[sealOrder[j],sealOrder[i]];render();return;}if(target.dataset.ending){state.ending=target.dataset.ending;save();render();window.scrollTo({top:0,behavior:'smooth'});return;}
switch(target.dataset.action){case 'open':go(state.ending?'final':'index');break;case 'index':go('index');break;case 'final':if(allSolved())go('final');break;case 'another':state.ending=null;save();go('final');break;case 'hint1':case 'hint2':{const c=byId(view.split(':')[1]);const level=target.dataset.action==='hint1'?1:2;hintLevels[c.id]=Math.max(level,hintLevels[c.id]||0);const el=document.getElementById('hint-text');if(el){el.hidden=false;el.textContent=c.hints.slice(0,hintLevels[c.id]).map((v,i)=>'Hint '+(i+1)+': '+v).join('  ');}break;}
case 'check1':if(sealOrder.every((v,i)=>v===i+1)){state.final1=true;save();render();window.scrollTo({top:0,behavior:'smooth'});}else feedback('final-feedback','The sentence is not in the correct chapter order. Check the Roman numerals.');break;
case 'finalhint1':case 'finalhint2':{const el=document.getElementById('final-hint');if(el){el.hidden=false;el.textContent=target.dataset.action==='finalhint1'?'Use the Roman numeral on each seal: I, II, III, IV, V, VI. Read the words in that order.':'The six marked words are sunrise (2), lantern (3), beacon (1), whirlpool (3), enchantment (2), and hidden (3). Count from the first letter of each word.';}break;}}
});
document.getElementById('home-btn').addEventListener('click',()=>go('index'));
document.getElementById('reset-btn').addEventListener('click',()=>{if(!confirm('Start over? This clears the six solved chapters and your ending on this device.'))return;state=initial();hintLevels={};sealOrder=[5,3,1,6,4,2];save();go('intro');});
window.addEventListener('popstate',()=>{const q=new URLSearchParams(location.search);view=q.get('chapter')&&byId(q.get('chapter').toUpperCase())?'chapter:'+q.get('chapter').toUpperCase():q.get('view')==='final'?'final':q.get('view')==='index'?'index':'intro';render();});
const query=new URLSearchParams(location.search);view=query.get('chapter')&&byId(query.get('chapter').toUpperCase())?'chapter:'+query.get('chapter').toUpperCase():query.get('view')==='final'?'final':query.get('view')==='index'?'index':'intro';render();
})();

</script></body></html>
